# Local secrets live in .env (KEY=value), loaded as properties. In Render they are real env vars.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Supabase's pooler drops idle connections (and a network/IP change kills them all): recycle and ping them
      # before that happens, so the API doesn't keep handing out dead connections
      max-lifetime: 300000
      keepalive-time: 60000
      idle-timeout: 120000
      connection-timeout: 10000
  jpa:
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50
    hibernate:
      ddl-auto: validate
  flyway:
    # Supabase already had V1 (applied by the CLI); an empty DB still runs V1 normally
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # photos are compressed to ~500 KB in the app; StorageClient.readJpeg enforces 2 MB
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

petzo:
  supabase-url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  supabase-anon-key: ${SUPABASE_ANON_KEY}
  internal-secret: ${INTERNAL_SECRET}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  ai-model: ${AI_MODEL:openai/gpt-4.1-mini}
  ai-daily-token-cap: ${AI_DAILY_TOKEN_CAP:2000000}
  n8n-moderation-url: ${N8N_MODERATION_WEBHOOK_URL:}
  n8n-notify-url: ${N8N_NOTIFY_WEBHOOK_URL:}
  # Where the API may send the browser back after Google sign-in (prefix match): app deep links and the admin panel
  auth-redirect-allowlist: ${AUTH_REDIRECT_ALLOWLIST:exp://,petzo://,http://localhost:5173}
  # Hosts the import may download photos from (the demo foundation site the Stagehand worker reads)
  import-allowed-hosts: ${IMPORT_ALLOWED_HOSTS:localhost}
  # Automatic imports: foundation pages to read and when (Spring cron, Caracas time). Daily at 06:00 by default; "-" turns it off
  import-auto-handles: ${IMPORT_AUTO_HANDLES:patas-del-avila}
  import-cron: ${IMPORT_CRON:0 0 6 * * *}
